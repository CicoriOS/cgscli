<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cgs</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="empty">
<aside id="sidebar">
  <div class="side-top">
    <button id="new-chat" class="pill" title="New chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>New chat</span></button>
    <button id="new-ws" class="pill" title="New workspace"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v4M10 13h4"/></svg><span>New workspace</span></button>
  </div>
  <nav id="tree"></nav>
</aside>

<main id="main">
  <header id="topbar">
    <button id="toggle-side" class="icon" title="Toggle sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <span id="title"></span>
    <span class="grow"></span>
    <button id="btw-btn" class="icon" title="btw: ask a side question"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg></button>
    <button id="toggle-right" class="icon" title="Toggle right sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
  </header>

  <section id="scroller">
    <div id="empty-hello">What's on the agenda today?</div>
    <div id="transcript"></div>
  </section>

  <div id="composer-wrap">
    <form id="composer" autocomplete="off">
      <button type="button" id="plus" class="icon" title="Attach (not available yet)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
      <button type="button" id="ring-btn" class="icon" aria-haspopup="dialog"></button>
      <button type="submit" id="send" title="Send"><svg class="i up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="i stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg></button>
    </form>
    <div id="popover" hidden></div>
  </div>

  <div id="btw-panel" hidden>
    <div class="btw-head"><b>btw</b><span class="muted">side question, not added to the chat</span><span class="grow"></span><button id="btw-close" class="icon small" title="Close">×</button></div>
    <form id="btw-form"><input id="btw-input" placeholder="Ask a side question…" autocomplete="off"><button id="btw-cancel" type="button" hidden>Cancel</button></form>
    <div id="btw-list"></div>
  </div>
</main>

<aside id="right" hidden><div class="placeholder">Files and Git changes will appear here</div></aside>

<button id="rpc-pill" title="Raw RPC frames">RPC</button>
<section id="rpc" hidden>
  <div class="rpc-bar">
    <b>RPC</b><span id="rpc-count" class="muted"></span>
    <label><input type="checkbox" id="rpc-stream"> show message_update</label>
    <button id="rpc-open">expand all</button><button id="rpc-close">collapse all</button><button id="rpc-clear">clear</button>
    <span class="grow"></span><button id="rpc-hide" class="icon small">×</button>
  </div>
  <div id="rpc-log"></div>
  <form id="rpc-form"><input id="rpc-raw" placeholder='raw frame, e.g. {"type":"get_state"}' autocomplete="off"></form>
</section>
<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
