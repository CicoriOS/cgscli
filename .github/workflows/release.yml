name: Release cgs
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Build patched npm bundle
        run: |
          bun install --frozen-lockfile
          bun scripts/fetch-omp.ts /tmp/omp-build
          bun scripts/replay-patches.ts /tmp/omp-build
          context=$(mktemp -d)
          cp "$(command -v bun)" "$context/bun"
          docker build -f docker/Dockerfile.build -t cgscli-build "$context"
          rm -r "$context"
          docker/build.sh /tmp/omp-build
          docker run --rm -v /tmp/omp-build:/src -w /src/packages/coding-agent cgscli-build bun run gen:bundle
      - name: Pack
        run: |
          tag="$GITHUB_REF_NAME"
          bun scripts/pack-release.ts "${tag##*-cgs.}" --out-dir "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/cicori-cgs-${tag#v}.tgz"
          mkdir release && cp "$RUNNER_TEMP/release/cicori-cgs-${tag#v}.tgz" release/
      - name: Smoke test the tarball
        # Installs it like a user and runs the real cgs: the extension loader, not Bun alone, decides how vendored libraries load.
        run: bun scripts/smoke-release.ts "release/cicori-cgs-${GITHUB_REF_NAME#v}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: release/*.tgz
          if-no-files-found: error

  # A separate job so that a failed publish is retried without rebuilding.
  publish:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing (OIDC); no npm token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: release
      # No registry-url: setup-node would write an .npmrc and export a placeholder NODE_AUTH_TOKEN, which npm would use instead of OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish to npm
        # Trusted publishing needs npm >= 11.5.1.
        run: |
          npm install -g npm@latest
          npm --version
          npm publish "./release/cicori-cgs-${GITHUB_REF_NAME#v}.tgz" --access public --provenance --tag latest
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "release/cicori-cgs-${tag#v}.tgz" --clobber
