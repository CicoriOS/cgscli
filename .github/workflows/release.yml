name: Release cgs
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # npm trusted publishing (OIDC); no npm token is stored

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build patched npm bundle
        run: |
          bun install --frozen-lockfile
          bun scripts/fetch-omp.ts /tmp/omp-build
          bun scripts/replay-patches.ts /tmp/omp-build
          context=$(mktemp -d)
          cp "$(command -v bun)" "$context/bun"
          docker build -f docker/Dockerfile.build -t cgscli-build "$context"
          rm -r "$context"
          docker/build.sh /tmp/omp-build
          docker run --rm -v /tmp/omp-build:/src -w /src/packages/coding-agent cgscli-build bun run gen:bundle
      - name: Pack
        run: |
          tag="$GITHUB_REF_NAME"
          bun scripts/pack-release.ts "${tag##*-cgs.}" --out-dir "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/cicori-cgs-${tag#v}.tgz"
      - name: Publish to npm
        # Trusted publishing needs npm >= 11.5.1. The version is in the tarball; a tag that disagrees fails here.
        run: |
          npm install -g npm@latest
          npm publish "$RUNNER_TEMP/release/cicori-cgs-${GITHUB_REF_NAME#v}.tgz" --access public --provenance --tag latest
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" "$RUNNER_TEMP/release/cicori-cgs-${tag#v}.tgz" --clobber
